<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — processos.html: Lista, busca e filtros de processos
Formato: caminho> descrição | CSS: classes usadas | JS: nome no processos.js
==============================================================================
processos>head> Configurações, título da aba ("Processos - TabFlower"), fontes do Google e css/estilo.css
processos>header> Faixa do topo com o logo, o menu de abas e o usuário logado | CSS: .cabecalho
processos>header>div> Organiza o topo: logo, abas e usuário lado a lado | CSS: .cabecalho-conteudo | JS: montarBarraUsuario() (api.js)
processos>header>div>div> Logo TabFlower | CSS: .marca, .marca span
processos>header>div>nav>ul> Menu com as abas Painel, Clientes, Processos, Documentos, Avisos, Usuários, Checklists, Importação (a aba desta página fica destacada) | CSS: .abas, .abas a, .abas a.ativa
processos>main> Área principal da lista de processos | CSS: .pagina
processos>main>h1> Título da página: "Processos" | CSS: .titulo-pagina
processos>main>p> Texto explicativo abaixo do título | CSS: .subtitulo-pagina
processos>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) | CSS: .escondido | JS: tela.aviso
processos>main>div> Barra com busca, filtros e botão de novo processo | CSS: .barra-acoes
processos>main>div>form> Formulário de busca de processos | CSS: .busca | JS: tela.formBusca
processos>main>div>form>input> Campo onde se digita número, título ou nome do cliente | CSS: .busca input | JS: tela.campoBusca
processos>main>div>form>button> Botão que dispara a busca | CSS: .botao
processos>main>div>button> Botão "Ver todos": limpa busca e filtros | CSS: .botao | JS: tela.botaoLimpar
processos>main>div>div> Espaço vazio que empurra o botão "Novo processo" para a direita | CSS: .espacador
processos>main>div>label> Caixinha "Mostrar arquivados" com o texto ao lado | CSS: .dica, style inline
processos>main>div>label>input> Caixinha de marcar para incluir os processos arquivados | JS: tela.mostrarInativos
processos>main>div>a> Botão "Novo processo": abre o formulário de cadastro | CSS: .botao, .botao-principal
processos>main>div> Faixa com os filtros de situação, advogado e tipo | CSS: .barra-filtros
processos>main>div>select> Filtro por situação do processo (preenchido pelo JS) | CSS: .barra-filtros select | JS: tela.filtroStatus
processos>main>div>select> Filtro por advogado responsável (preenchido pelo JS) | CSS: .barra-filtros select | JS: tela.filtroAdvogado
processos>main>div>select> Filtro por tipo de processo (preenchido pelo JS) | CSS: .barra-filtros select | JS: tela.filtroTipo
processos>main>div>span> Rótulo que mostra de onde veio o resultado (Model ou procedure) | CSS: .dica, #rotulo-fonte | JS: tela.rotuloFonte
processos>main>div> Lista dos processos (preenchida pelo JS) | CSS: .lista | JS: tela.lista
processos>script> Carrega js/api.js e js/processos.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Processos - TabFlower</title>
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">Tab<span>Flower</span></div>
            <nav>
                <ul class="abas">
                    <li><a href="painel.html">Painel</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="processos.html" class="ativa">Processos</a></li>
                    <li><a href="documentos.html">Documentos</a></li>
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="checklists.html">Checklists</a></li>
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina">

        <h1 class="titulo-pagina">Processos</h1>
        <p class="subtitulo-pagina">
            Busque pelo número da ação, pelo título ou pelo nome do cliente.
        </p>

        <div id="aviso" class="escondido"></div>

        <div class="barra-acoes">
            <form class="busca" id="form-busca">
                <input type="text" id="campo-busca"
                       placeholder="Número, título ou nome do cliente"
                       aria-label="Buscar processo">
                <button type="submit" class="botao">Buscar</button>
            </form>

            <button type="button" class="botao" id="botao-limpar">Ver todos</button>

            <div class="espacador"></div>

            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="mostrar-inativos">
                Mostrar arquivados
            </label>

            <a href="processo-form.html" class="botao botao-principal">Novo processo</a>
        </div>

        <div class="barra-filtros">
            <label class="dica" for="filtro-status">Situação</label>
            <select id="filtro-status"></select>

            <label class="dica" for="filtro-advogado">Advogado</label>
            <select id="filtro-advogado"></select>

            <label class="dica" for="filtro-tipo">Tipo</label>
            <select id="filtro-tipo"></select>

            <span class="dica" id="rotulo-fonte"></span>
        </div>

        <div id="lista" class="lista"></div>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/processos.js"></script>
</body>
</html>
