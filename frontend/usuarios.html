<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — usuarios.html: Lista de usuários
Formato: caminho> descrição | CSS: classes usadas | JS: nome no usuarios.js
==============================================================================
usuarios>head> Configurações, título da aba ("Usuários - TabFlower"), fontes do Google e css/estilo.css
usuarios>header> Faixa do topo com o logo, o menu de abas e o usuário logado | CSS: .cabecalho
usuarios>header>div> Organiza o topo: logo, abas e usuário lado a lado | CSS: .cabecalho-conteudo | JS: montarBarraUsuario() (api.js)
usuarios>header>div>div> Logo TabFlower | CSS: .marca, .marca span
usuarios>header>div>nav>ul> Menu com as abas Painel, Clientes, Processos, Documentos, Avisos, Usuários, Checklists, Importação (a aba desta página fica destacada) | CSS: .abas, .abas a, .abas a.ativa
usuarios>main> Área principal da lista de usuários | CSS: .pagina
usuarios>main>h1> Título da página: "Usuários" | CSS: .titulo-pagina
usuarios>main>p> Texto explicativo abaixo do título | CSS: .subtitulo-pagina
usuarios>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) | CSS: .escondido | JS: tela.aviso
usuarios>main>div> Barra com a caixinha de inativos e o botão de novo usuário | CSS: .barra-acoes
usuarios>main>div>div> Espaço vazio que empurra os itens para a direita | CSS: .espacador
usuarios>main>div>label> Caixinha "Mostrar inativos" com o texto ao lado | CSS: .dica, style inline
usuarios>main>div>label>input> Caixinha de marcar para incluir os usuários desativados | JS: tela.mostrarInativos
usuarios>main>div>a> Botão "Novo usuário": abre o formulário de cadastro | CSS: .botao, .botao-principal
usuarios>main>div> Lista dos usuários (preenchida pelo JS) | CSS: .lista | JS: tela.lista
usuarios>script> Carrega js/api.js e js/usuarios.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Usuários - TabFlower</title>
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">Tab<span>Flower</span></div>
            <nav>
                <ul class="abas">
                    <li><a href="painel.html">Painel</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="processos.html">Processos</a></li>
                    <li><a href="documentos.html">Documentos</a></li>
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <li><a href="usuarios.html" class="ativa">Usuários</a></li>
                    <li><a href="checklists.html">Checklists</a></li>
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina">

        <h1 class="titulo-pagina">Usuários</h1>
        <p class="subtitulo-pagina">
            Equipe do escritório. Só o perfil Admin pode excluir e restaurar
            documentos e desativar cadastros.
        </p>

        <div id="aviso" class="escondido"></div>

        <div class="barra-acoes">
            <div class="espacador"></div>

            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="mostrar-inativos">
                Mostrar inativos
            </label>

            <a href="usuario-form.html" class="botao botao-principal">Novo usuário</a>
        </div>

        <div id="lista" class="lista"></div>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/usuarios.js"></script>
</body>
</html>
