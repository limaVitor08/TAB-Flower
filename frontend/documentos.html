<!DOCTYPE html>
<!-- documentos>html> Raiz da página, com idioma português do Brasil -->
<html lang="pt-BR">
<!-- documentos>head> Parte invisível da página: configurações, título da aba e arquivos ligados -->
<head>
    <!-- documentos>head>meta> Usa a codificação UTF-8 para os acentos aparecerem certo -->
    <meta charset="UTF-8">
    <!-- documentos>head>meta> Ajusta a página à largura da tela (celular) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- documentos>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- documentos>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- documentos>head>link> Carrega as fontes Archivo (títulos), Roboto Mono (números) e Source Sans 3 (texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <!-- documentos>head>link> Liga o arquivo de estilo do site (css/estilo.css) -->
    <!-- [CSS] css/estilo.css -->
    <link rel="stylesheet" href="css/estilo.css">
    <!-- documentos>head>title> Texto da aba do navegador: "Documentos - TabFlower" -->
    <title>Documentos - TabFlower</title>
</head>
<!-- documentos>body> Corpo da página: tudo que aparece na tela -->
<!-- [CSS] body -->
<body>

    <!-- documentos>header> Faixa do topo com o logo, o menu de abas e o usuário logado -->
    <!-- [CSS] .cabecalho -->
    <header class="cabecalho">
        <!-- documentos>header>div> Organiza o topo: logo, abas e usuário lado a lado -->
        <!-- [CSS] .cabecalho-conteudo | .cabecalho-conteudo @media (max-width: 700px) -->
        <!-- [JS] api.js: montarBarraUsuario() -->
        <div class="cabecalho-conteudo">
            <!-- documentos>header>div>div> Logo TabFlower -->
            <!-- [CSS] .marca -->
            <!-- documentos>header>div>div>span> Palavra "Flower" do logo -->
            <!-- [CSS] .marca span -->
            <div class="marca">Tab<span>Flower</span></div>
            <!-- documentos>header>div>nav> Menu de navegação entre as telas -->
            <nav>
                <!-- documentos>header>div>nav>ul> Lista das abas do menu -->
                <!-- [CSS] .abas | .abas @media (max-width: 700px) -->
                <ul class="abas">
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Painel" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Painel" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="painel.html">Painel</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Clientes" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Clientes" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="clientes.html">Clientes</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Processos" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Processos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="processos.html">Processos</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Documentos" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Documentos" (aba da página atual, fica destacada) -->
                    <!-- [CSS] .abas a | .abas a:hover | .abas a.ativa -->
                    <li><a href="documentos.html" class="ativa">Documentos</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Avisos" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Avisos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Usuários" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Usuários" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="usuarios.html">Usuários</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Checklists" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Checklists" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="checklists.html">Checklists</a></li>
                    <!-- documentos>header>div>nav>ul>li> Item do menu: aba "Importação" -->
                    <!-- documentos>header>div>nav>ul>li>a> Link para a tela "Importação" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- documentos>main> Área principal do acervo de documentos -->
    <!-- [CSS] .pagina -->
    <main class="pagina">

        <!-- documentos>main>h1> Título da página: "Documentos" -->
        <!-- [CSS] .titulo-pagina -->
        <h1 class="titulo-pagina">Documentos</h1>
        <!-- documentos>main>p> Texto explicativo abaixo do título -->
        <!-- [CSS] .subtitulo-pagina -->
        <p class="subtitulo-pagina">
            Acervo do escritório. Os arquivos são anexados pela tela do processo.
        </p>

        <!-- documentos>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) -->
        <!-- [CSS] .escondido -->
        <!-- [JS] documentos.js: tela.aviso -->
        <div id="aviso" class="escondido"></div>

        <!-- documentos>main>div> Barra com o filtro e as opções da lista -->
        <!-- [CSS] .barra-acoes -->
        <div class="barra-acoes">
            <!-- documentos>main>div>form> Formulário de filtro do acervo -->
            <!-- [CSS] .busca -->
            <!-- [JS] documentos.js: tela.formBusca -->
            <form class="busca" id="form-busca">
                <!-- documentos>main>div>form>input> Campo para filtrar por nome do arquivo, cliente ou categoria -->
                <!-- [CSS] .busca input | .busca input:focus -->
                <!-- [JS] documentos.js: tela.campoBusca -->
                <input type="text" id="campo-busca"
                       placeholder="Nome do arquivo, cliente ou categoria"
                       aria-label="Filtrar documentos">
                <!-- documentos>main>div>form>button> Botão que aplica o filtro -->
                <!-- [CSS] .botao | .botao:hover -->
                <button type="submit" class="botao">Filtrar</button>
            </form>

            <!-- documentos>main>div>button> Botão "Ver todos": limpa o filtro -->
            <!-- [CSS] .botao | .botao:hover -->
            <!-- [JS] documentos.js: tela.botaoLimpar -->
            <button type="button" class="botao" id="botao-limpar">Ver todos</button>

            <!-- documentos>main>div>div> Espaço vazio que empurra a caixinha para a direita -->
            <!-- [CSS] .espacador -->
            <div class="espacador"></div>

            <!-- documentos>main>div>label> Caixinha "Mostrar excluídos" com o texto ao lado -->
            <!-- [CSS] .dica | style inline -->
            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <!-- documentos>main>div>label>input> Caixinha de marcar para incluir os documentos excluídos -->
                <!-- [JS] documentos.js: tela.mostrarExcluidos -->
                <input type="checkbox" id="mostrar-excluidos">
                Mostrar excluídos
            </label>
        </div>

        <!-- documentos>main>div> Lista dos documentos (preenchida pelo JS) -->
        <!-- [CSS] .lista -->
        <!-- [JS] documentos.js: tela.lista -->
        <div id="lista" class="lista"></div>

    </main>

    <!-- documentos>script> Carrega o api.js: chamadas à API, sessão de login e funções de apoio -->
    <!-- [JS] js/api.js -->
    <script charset="UTF-8" src="js/api.js"></script>
    <!-- documentos>script> Carrega o documentos.js, que faz esta página funcionar -->
    <!-- [JS] js/documentos.js -->
    <script charset="UTF-8" src="js/documentos.js"></script>
</body>
</html>
