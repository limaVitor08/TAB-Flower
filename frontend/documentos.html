<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — documentos.html: Acervo de documentos
Formato: caminho> descrição | CSS: classes usadas | JS: nome no documentos.js
==============================================================================
documentos>head> Configurações, título da aba ("Documentos - TabFlower"), fontes do Google e css/estilo.css
documentos>header> Faixa do topo com o logo, o menu de abas e o usuário logado | CSS: .cabecalho
documentos>header>div> Organiza o topo: logo, abas e usuário lado a lado | CSS: .cabecalho-conteudo | JS: montarBarraUsuario() (api.js)
documentos>header>div>div> Logo TabFlower | CSS: .marca, .marca span
documentos>header>div>nav>ul> Menu com as abas Painel, Clientes, Processos, Documentos, Avisos, Usuários, Checklists, Importação (a aba desta página fica destacada) | CSS: .abas, .abas a, .abas a.ativa
documentos>main> Área principal do acervo de documentos | CSS: .pagina
documentos>main>h1> Título da página: "Documentos" | CSS: .titulo-pagina
documentos>main>p> Texto explicativo abaixo do título | CSS: .subtitulo-pagina
documentos>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) | CSS: .escondido | JS: tela.aviso
documentos>main>div> Barra com o filtro e as opções da lista | CSS: .barra-acoes
documentos>main>div>form> Formulário de filtro do acervo | CSS: .busca | JS: tela.formBusca
documentos>main>div>form>input> Campo para filtrar por nome do arquivo, cliente ou categoria | CSS: .busca input | JS: tela.campoBusca
documentos>main>div>form>button> Botão que aplica o filtro | CSS: .botao
documentos>main>div>button> Botão "Ver todos": limpa o filtro | CSS: .botao | JS: tela.botaoLimpar
documentos>main>div>div> Espaço vazio que empurra a caixinha para a direita | CSS: .espacador
documentos>main>div>label> Caixinha "Mostrar excluídos" com o texto ao lado | CSS: .dica, style inline
documentos>main>div>label>input> Caixinha de marcar para incluir os documentos excluídos | JS: tela.mostrarExcluidos
documentos>main>div> Lista dos documentos (preenchida pelo JS) | CSS: .lista | JS: tela.lista
documentos>script> Carrega js/api.js e js/documentos.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Documentos - TabFlower</title>
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">Tab<span>Flower</span></div>
            <nav>
                <ul class="abas">
                    <li><a href="painel.html">Painel</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="processos.html">Processos</a></li>
                    <li><a href="documentos.html" class="ativa">Documentos</a></li>
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="checklists.html">Checklists</a></li>
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina">

        <h1 class="titulo-pagina">Documentos</h1>
        <p class="subtitulo-pagina">
            Acervo do escritório. Os arquivos são anexados pela tela do processo.
        </p>

        <div id="aviso" class="escondido"></div>

        <div class="barra-acoes">
            <form class="busca" id="form-busca">
                <input type="text" id="campo-busca"
                       placeholder="Nome do arquivo, cliente ou categoria"
                       aria-label="Filtrar documentos">
                <button type="submit" class="botao">Filtrar</button>
            </form>

            <button type="button" class="botao" id="botao-limpar">Ver todos</button>

            <div class="espacador"></div>

            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="mostrar-excluidos">
                Mostrar excluídos
            </label>
        </div>

        <div id="lista" class="lista"></div>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/documentos.js"></script>
</body>
</html>
