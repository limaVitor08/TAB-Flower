<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — login.html: Tela de login (e-mail e senha)
Formato: caminho> descrição | CSS: classes usadas | JS: nome no login.js
==============================================================================
login>head> Configurações, título da aba ("Entrar - TabFlower"), fontes do Google e css/estilo.css
login>body> Corpo da tela de login | CSS: body, .tela-login
login>main> Caixa branca central com o logo e o formulário de entrada | CSS: .caixa-login
login>main>div> Logo TabFlower dentro da caixa de login | CSS: .marca, .marca-login
login>main>p> Frase de apresentação do sistema abaixo do logo | CSS: .subtitulo-login
login>main>div> Caixa de mensagem de erro do login (começa escondida) | CSS: .escondido | JS: tela.aviso
login>main>form> Formulário de login com e-mail, senha e botão Entrar | CSS: .formulario, .formulario-login | JS: tela.form
login>main>form>div> Bloco do campo de e-mail | CSS: .campo, .campo-largo
login>main>form>div>input> Campo onde a pessoa digita o e-mail | CSS: .campo input | JS: tela.email
login>main>form>div> Bloco do campo de senha | CSS: .campo, .campo-largo
login>main>form>div>input> Campo onde a pessoa digita a senha (texto escondido) | CSS: .campo input | JS: tela.senha
login>main>form>div> Área do botão de enviar | CSS: .formulario-login .acoes-formulario
login>main>form>div>button> Botão Entrar | CSS: .botao, .botao-principal, .formulario-login .botao-principal | JS: tela.botao
login>script> Carrega js/api.js e js/login.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TabFlower</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="tela-login">

    <main class="caixa-login">

        <div class="marca marca-login">Tab<span>Flower</span></div>

        <p class="subtitulo-login">
            Gestão documental e processual do escritório.
        </p>

        <div id="aviso" class="escondido"></div>

        <form class="formulario formulario-login" id="form-login">

            <div class="campo campo-largo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autofocus
                       placeholder="voce@tabflower.com" autocomplete="username">
            </div>

            <div class="campo campo-largo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required
                       autocomplete="current-password">
            </div>

            <div class="acoes-formulario">
                <button type="submit" class="botao botao-principal" id="botao-entrar">
                    Entrar
                </button>
            </div>

        </form>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/login.js"></script>
</body>
</html>
