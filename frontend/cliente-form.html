<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — cliente-form.html: Cadastro e edição de cliente
Formato: caminho> descrição | CSS: classes usadas | JS: nome no cliente-form.js
==============================================================================
cliente-form>head> Configurações, título da aba ("Cadastro de cliente - TabFlower"), fontes do Google e css/estilo.css
cliente-form>header> Faixa do topo com o logo, o menu de abas e o usuário logado | CSS: .cabecalho
cliente-form>header>div> Organiza o topo: logo, abas e usuário lado a lado | CSS: .cabecalho-conteudo | JS: montarBarraUsuario() (api.js)
cliente-form>header>div>div> Logo TabFlower | CSS: .marca, .marca span
cliente-form>header>div>nav>ul> Menu com as abas Painel, Clientes, Processos, Documentos, Avisos, Usuários, Checklists, Importação (a aba desta página fica destacada) | CSS: .abas, .abas a, .abas a.ativa
cliente-form>main> Área principal do formulário de cliente | CSS: .pagina
cliente-form>main>h1> Título da página: "Novo cliente" | CSS: .titulo-pagina | JS: tela.titulo
cliente-form>main>p> Texto explicativo abaixo do título | CSS: .subtitulo-pagina | JS: tela.subtitulo
cliente-form>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) | CSS: .escondido | JS: tela.aviso
cliente-form>main>form> Formulário de cadastro e edição de cliente | CSS: .formulario | JS: tela.form
cliente-form>main>form>div> Grade que organiza os campos em duas colunas | CSS: .grupo-campos
cliente-form>main>form>div>div> Bloco do campo "Tipo de pessoa" | CSS: .campo
cliente-form>main>form>div>div>select> Lista para escolher pessoa física (CPF) ou jurídica (CNPJ) | CSS: .campo select | JS: campos.tipoPessoa
cliente-form>main>form>div>div> Bloco do campo "CPF / CNPJ" | CSS: .campo
cliente-form>main>form>div>div>input> Campo do CPF ou CNPJ | CSS: .mono, .campo input | JS: campos.documento
cliente-form>main>form>div>div>span> Dica abaixo do documento avisando que ele não pode ser alterado | CSS: .dica | JS: tela.dicaDocumento
cliente-form>main>form>div>div> Bloco do campo "Nome completo / Razão social" | CSS: .campo, .campo-largo
cliente-form>main>form>div>div>input> Campo do nome do cliente | CSS: .campo input | JS: campos.nome
cliente-form>main>form>div>div> Bloco do campo "E-mail" | CSS: .campo
cliente-form>main>form>div>div>input> Campo do e-mail do cliente | CSS: .campo input | JS: campos.email
cliente-form>main>form>div>div> Bloco do campo "Telefone" | CSS: .campo
cliente-form>main>form>div>div>input> Campo do telefone | CSS: .mono, .campo input | JS: campos.telefone
cliente-form>main>form>div>div> Bloco do campo "Endereço" | CSS: .campo, .campo-largo
cliente-form>main>form>div>div>input> Campo do endereço | CSS: .campo input | JS: campos.endereco
cliente-form>main>form>div>div> Bloco do campo "Cidade" | CSS: .campo
cliente-form>main>form>div>div>input> Campo da cidade | CSS: .campo input | JS: campos.cidade
cliente-form>main>form>div>div> Bloco do campo "Estado (UF)" | CSS: .campo
cliente-form>main>form>div>div>input> Campo do estado com 2 letras | CSS: .campo input, style inline | JS: campos.estado
cliente-form>main>form>div>div> Bloco do campo "Observações" | CSS: .campo, .campo-largo
cliente-form>main>form>div>div>textarea> Caixa de texto grande para observações | CSS: .campo textarea | JS: campos.observacao
cliente-form>main>form>div> Rodapé do formulário com os botões | CSS: .rodape-formulario
cliente-form>main>form>div>button> Botão de salvar ("Cadastrar cliente") | CSS: .botao, .botao-principal | JS: tela.botaoSalvar
cliente-form>main>form>div>a> Botão "Cancelar": volta para a lista sem salvar | CSS: .botao
cliente-form>script> Carrega js/api.js e js/cliente-form.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de cliente - TabFlower</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">Tab<span>Flower</span></div>
            <nav>
                <ul class="abas">
                    <li><a href="painel.html">Painel</a></li>
                    <li><a href="clientes.html" class="ativa">Clientes</a></li>
                    <li><a href="processos.html">Processos</a></li>
                    <li><a href="documentos.html">Documentos</a></li>
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="checklists.html">Checklists</a></li>
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina">

        <h1 class="titulo-pagina" id="titulo">Novo cliente</h1>
        <p class="subtitulo-pagina" id="subtitulo">
            O CPF ou CNPJ é conferido automaticamente e não pode se repetir.
        </p>

        <div id="aviso" class="escondido"></div>

        <form class="formulario" id="form-cliente">

            <div class="grupo-campos">

                <div class="campo">
                    <label for="tipo_pessoa">
                        Tipo de pessoa <span class="obrigatorio">*</span>
                    </label>
                    <select id="tipo_pessoa" required>
                        <option value="F">Pessoa física (CPF)</option>
                        <option value="J">Pessoa jurídica (CNPJ)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="documento">
                        CPF / CNPJ <span class="obrigatorio">*</span>
                    </label>
                    <input type="text" id="documento" class="mono" required
                           placeholder="000.000.000-00" maxlength="18">
                    <span class="dica" id="dica-documento">
                        Não pode ser alterado depois do cadastro.
                    </span>
                </div>

                <div class="campo campo-largo">
                    <label for="nome">
                        Nome completo / Razão social <span class="obrigatorio">*</span>
                    </label>
                    <input type="text" id="nome" required maxlength="150">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" maxlength="120">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" class="mono" maxlength="20">
                </div>

                <div class="campo campo-largo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" maxlength="200">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" maxlength="80">
                </div>

                <div class="campo">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" maxlength="2"
                           placeholder="MG" style="text-transform: uppercase;">
                </div>

                <div class="campo campo-largo">
                    <label for="observacao">Observações</label>
                    <textarea id="observacao"></textarea>
                </div>

            </div>

            <div class="rodape-formulario">
                <button type="submit" class="botao botao-principal" id="botao-salvar">
                    Cadastrar cliente
                </button>
                <a href="clientes.html" class="botao">Cancelar</a>
            </div>

        </form>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/cliente-form.js"></script>
</body>
</html>
