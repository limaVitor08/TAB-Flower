<!DOCTYPE html>
<!-- cliente-form>html> Raiz da página, com idioma português do Brasil -->
<html lang="pt-BR">
<!-- cliente-form>head> Parte invisível da página: configurações, título da aba e arquivos ligados -->
<head>
    <!-- cliente-form>head>meta> Usa a codificação UTF-8 para os acentos aparecerem certo -->
    <meta charset="UTF-8">
    <!-- cliente-form>head>meta> Ajusta a página à largura da tela (celular) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- cliente-form>head>title> Texto da aba do navegador: "Cadastro de cliente - TabFlower" -->
    <title>Cadastro de cliente - TabFlower</title>

    <!-- cliente-form>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- cliente-form>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- cliente-form>head>link> Carrega as fontes Archivo (títulos), Roboto Mono (números) e Source Sans 3 (texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <!-- cliente-form>head>link> Liga o arquivo de estilo do site (css/estilo.css) -->
    <!-- [CSS] css/estilo.css -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<!-- cliente-form>body> Corpo da página: tudo que aparece na tela -->
<!-- [CSS] body -->
<body>

    <!-- cliente-form>header> Faixa do topo com o logo, o menu de abas e o usuário logado -->
    <!-- [CSS] .cabecalho -->
    <header class="cabecalho">
        <!-- cliente-form>header>div> Organiza o topo: logo, abas e usuário lado a lado -->
        <!-- [CSS] .cabecalho-conteudo | .cabecalho-conteudo @media (max-width: 700px) -->
        <!-- [JS] api.js: montarBarraUsuario() -->
        <div class="cabecalho-conteudo">
            <!-- cliente-form>header>div>div> Logo TabFlower -->
            <!-- [CSS] .marca -->
            <!-- cliente-form>header>div>div>span> Palavra "Flower" do logo -->
            <!-- [CSS] .marca span -->
            <div class="marca">Tab<span>Flower</span></div>
            <!-- cliente-form>header>div>nav> Menu de navegação entre as telas -->
            <nav>
                <!-- cliente-form>header>div>nav>ul> Lista das abas do menu -->
                <!-- [CSS] .abas | .abas @media (max-width: 700px) -->
                <ul class="abas">
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Painel" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Painel" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="painel.html">Painel</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Clientes" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Clientes" (aba da página atual, fica destacada) -->
                    <!-- [CSS] .abas a | .abas a:hover | .abas a.ativa -->
                    <li><a href="clientes.html" class="ativa">Clientes</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Processos" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Processos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="processos.html">Processos</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Documentos" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Documentos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="documentos.html">Documentos</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Avisos" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Avisos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Usuários" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Usuários" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="usuarios.html">Usuários</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Checklists" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Checklists" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="checklists.html">Checklists</a></li>
                    <!-- cliente-form>header>div>nav>ul>li> Item do menu: aba "Importação" -->
                    <!-- cliente-form>header>div>nav>ul>li>a> Link para a tela "Importação" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- cliente-form>main> Área principal do formulário de cliente -->
    <!-- [CSS] .pagina -->
    <main class="pagina">

        <!-- cliente-form>main>h1> Título da página: "Novo cliente" -->
        <!-- [CSS] .titulo-pagina -->
        <!-- [JS] cliente-form.js: tela.titulo -->
        <h1 class="titulo-pagina" id="titulo">Novo cliente</h1>
        <!-- cliente-form>main>p> Texto explicativo abaixo do título -->
        <!-- [CSS] .subtitulo-pagina -->
        <!-- [JS] cliente-form.js: tela.subtitulo -->
        <p class="subtitulo-pagina" id="subtitulo">
            O CPF ou CNPJ é conferido automaticamente e não pode se repetir.
        </p>

        <!-- cliente-form>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) -->
        <!-- [CSS] .escondido -->
        <!-- [JS] cliente-form.js: tela.aviso -->
        <div id="aviso" class="escondido"></div>

        <!-- cliente-form>main>form> Formulário de cadastro e edição de cliente -->
        <!-- [CSS] .formulario -->
        <!-- [JS] cliente-form.js: tela.form -->
        <form class="formulario" id="form-cliente">

            <!-- cliente-form>main>form>div> Grade que organiza os campos em duas colunas -->
            <!-- [CSS] .grupo-campos | .grupo-campos @media (max-width: 700px) -->
            <div class="grupo-campos">

                <!-- cliente-form>main>form>div>div> Bloco do campo "Tipo de pessoa" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Tipo de pessoa" -->
                    <!-- [CSS] .campo label -->
                    <label for="tipo_pessoa">
                        <!-- cliente-form>main>form>div>div>label>span> Asterisco que marca o campo como obrigatório -->
                        <!-- [CSS] .campo label .obrigatorio -->
                        Tipo de pessoa <span class="obrigatorio">*</span>
                    </label>
                    <!-- cliente-form>main>form>div>div>select> Lista para escolher pessoa física (CPF) ou jurídica (CNPJ) -->
                    <!-- [CSS] .campo select | .campo select:focus -->
                    <!-- [JS] cliente-form.js: campos.tipoPessoa -->
                    <select id="tipo_pessoa" required>
                        <!-- cliente-form>main>form>div>div>select>option> Opção "Pessoa física (CPF)" -->
                        <option value="F">Pessoa física (CPF)</option>
                        <!-- cliente-form>main>form>div>div>select>option> Opção "Pessoa jurídica (CNPJ)" -->
                        <option value="J">Pessoa jurídica (CNPJ)</option>
                    </select>
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "CPF / CNPJ" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "CPF / CNPJ" -->
                    <!-- [CSS] .campo label -->
                    <label for="documento">
                        <!-- cliente-form>main>form>div>div>label>span> Asterisco que marca o campo como obrigatório -->
                        <!-- [CSS] .campo label .obrigatorio -->
                        CPF / CNPJ <span class="obrigatorio">*</span>
                    </label>
                    <!-- cliente-form>main>form>div>div>input> Campo do CPF ou CNPJ -->
                    <!-- [CSS] .mono | .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.documento -->
                    <input type="text" id="documento" class="mono" required
                           placeholder="000.000.000-00" maxlength="18">
                    <!-- cliente-form>main>form>div>div>span> Dica abaixo do documento avisando que ele não pode ser alterado -->
                    <!-- [CSS] .dica -->
                    <!-- [JS] cliente-form.js: tela.dicaDocumento -->
                    <span class="dica" id="dica-documento">
                        Não pode ser alterado depois do cadastro.
                    </span>
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Nome completo / Razão social" -->
                <!-- [CSS] .campo | .campo-largo -->
                <div class="campo campo-largo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Nome completo / Razão social" -->
                    <!-- [CSS] .campo label -->
                    <label for="nome">
                        <!-- cliente-form>main>form>div>div>label>span> Asterisco que marca o campo como obrigatório -->
                        <!-- [CSS] .campo label .obrigatorio -->
                        Nome completo / Razão social <span class="obrigatorio">*</span>
                    </label>
                    <!-- cliente-form>main>form>div>div>input> Campo do nome do cliente -->
                    <!-- [CSS] .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.nome -->
                    <input type="text" id="nome" required maxlength="150">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "E-mail" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "E-mail" -->
                    <!-- [CSS] .campo label -->
                    <label for="email">E-mail</label>
                    <!-- cliente-form>main>form>div>div>input> Campo do e-mail do cliente -->
                    <!-- [CSS] .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.email -->
                    <input type="email" id="email" maxlength="120">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Telefone" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Telefone" -->
                    <!-- [CSS] .campo label -->
                    <label for="telefone">Telefone</label>
                    <!-- cliente-form>main>form>div>div>input> Campo do telefone -->
                    <!-- [CSS] .mono | .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.telefone -->
                    <input type="text" id="telefone" class="mono" maxlength="20">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Endereço" -->
                <!-- [CSS] .campo | .campo-largo -->
                <div class="campo campo-largo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Endereço" -->
                    <!-- [CSS] .campo label -->
                    <label for="endereco">Endereço</label>
                    <!-- cliente-form>main>form>div>div>input> Campo do endereço -->
                    <!-- [CSS] .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.endereco -->
                    <input type="text" id="endereco" maxlength="200">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Cidade" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Cidade" -->
                    <!-- [CSS] .campo label -->
                    <label for="cidade">Cidade</label>
                    <!-- cliente-form>main>form>div>div>input> Campo da cidade -->
                    <!-- [CSS] .campo input | .campo input:focus | .campo input:disabled -->
                    <!-- [JS] cliente-form.js: campos.cidade -->
                    <input type="text" id="cidade" maxlength="80">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Estado (UF)" -->
                <!-- [CSS] .campo -->
                <div class="campo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Estado (UF)" -->
                    <!-- [CSS] .campo label -->
                    <label for="estado">Estado (UF)</label>
                    <!-- cliente-form>main>form>div>div>input> Campo do estado com 2 letras -->
                    <!-- [CSS] .campo input | .campo input:focus | .campo input:disabled | style inline -->
                    <!-- [JS] cliente-form.js: campos.estado -->
                    <input type="text" id="estado" maxlength="2"
                           placeholder="MG" style="text-transform: uppercase;">
                </div>

                <!-- cliente-form>main>form>div>div> Bloco do campo "Observações" -->
                <!-- [CSS] .campo | .campo-largo -->
                <div class="campo campo-largo">
                    <!-- cliente-form>main>form>div>div>label> Rótulo "Observações" -->
                    <!-- [CSS] .campo label -->
                    <label for="observacao">Observações</label>
                    <!-- cliente-form>main>form>div>div>textarea> Caixa de texto grande para observações -->
                    <!-- [CSS] .campo textarea | .campo textarea:focus -->
                    <!-- [JS] cliente-form.js: campos.observacao -->
                    <textarea id="observacao"></textarea>
                </div>

            </div>

            <!-- cliente-form>main>form>div> Rodapé do formulário com os botões -->
            <!-- [CSS] .rodape-formulario -->
            <div class="rodape-formulario">
                <!-- cliente-form>main>form>div>button> Botão de salvar ("Cadastrar cliente") -->
                <!-- [CSS] .botao | .botao:hover | .botao-principal | .botao-principal:hover -->
                <!-- [JS] cliente-form.js: tela.botaoSalvar -->
                <button type="submit" class="botao botao-principal" id="botao-salvar">
                    Cadastrar cliente
                </button>
                <!-- cliente-form>main>form>div>a> Botão "Cancelar": volta para a lista sem salvar -->
                <!-- [CSS] .botao | .botao:hover -->
                <a href="clientes.html" class="botao">Cancelar</a>
            </div>

        </form>

    </main>

    <!-- cliente-form>script> Carrega o api.js: chamadas à API, sessão de login e funções de apoio -->
    <!-- [JS] js/api.js -->
    <script charset="UTF-8" src="js/api.js"></script>
    <!-- cliente-form>script> Carrega o cliente-form.js, que faz esta página funcionar -->
    <!-- [JS] js/cliente-form.js -->
    <script charset="UTF-8" src="js/cliente-form.js"></script>
</body>
</html>
