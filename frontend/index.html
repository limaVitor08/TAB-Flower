<!DOCTYPE html>
<!-- index>html> Raiz da página, com idioma português do Brasil -->
<html lang="pt-BR">
<!-- index>head> Parte invisível da página: configurações, título da aba e arquivos ligados -->
<head>
    <!-- index>head>meta> Usa a codificação UTF-8 para os acentos aparecerem certo -->
    <meta charset="UTF-8">
    <!-- index>head>title> Texto da aba do navegador: "TabFlower" -->
    <title>TabFlower</title>
    <!-- index>head>meta> Redireciona sozinho para a tela de login assim que a página abre -->
    <meta http-equiv="refresh" content="0; url=login.html">
</head>
<!-- index>body> Corpo da página: tudo que aparece na tela -->
<body>
    <!-- index>p> Mensagem de espera enquanto o navegador vai para o login -->
    <!-- index>p>a> Link manual para o login, caso o redirecionamento não aconteça -->
    <p>Abrindo o TabFlower... <a href="login.html">Clique aqui</a> se nada acontecer.</p>
</body>
</html>
