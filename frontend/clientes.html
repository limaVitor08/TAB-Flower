<!DOCTYPE html>
<!--
==============================================================================
SEÇÃO COMENTÁRIOS — clientes.html: Lista e busca de clientes
Formato: caminho> descrição | CSS: classes usadas | JS: nome no clientes.js
==============================================================================
clientes>head> Configurações, título da aba ("Clientes - TabFlower"), fontes do Google e css/estilo.css
clientes>header> Faixa do topo com o logo, o menu de abas e o usuário logado | CSS: .cabecalho
clientes>header>div> Organiza o topo: logo, abas e usuário lado a lado | CSS: .cabecalho-conteudo | JS: montarBarraUsuario() (api.js)
clientes>header>div>div> Logo TabFlower | CSS: .marca, .marca span
clientes>header>div>nav>ul> Menu com as abas Painel, Clientes, Processos, Documentos, Avisos, Usuários, Checklists, Importação (a aba desta página fica destacada) | CSS: .abas, .abas a, .abas a.ativa
clientes>main> Área principal da lista de clientes | CSS: .pagina
clientes>main>h1> Título da página: "Clientes" | CSS: .titulo-pagina
clientes>main>p> Texto explicativo abaixo do título | CSS: .subtitulo-pagina
clientes>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) | CSS: .escondido | JS: tela.aviso
clientes>main>div> Barra com busca, filtros e botão de novo cliente | CSS: .barra-acoes
clientes>main>div>form> Formulário de busca de clientes | CSS: .busca | JS: tela.formBusca
clientes>main>div>form>input> Campo onde se digita o nome ou o CPF/CNPJ para buscar | CSS: .busca input | JS: tela.campoBusca
clientes>main>div>form>button> Botão que dispara a busca | CSS: .botao
clientes>main>div>button> Botão "Ver todos": limpa a busca e mostra a lista completa | CSS: .botao | JS: tela.botaoLimpar
clientes>main>div>div> Espaço vazio que empurra o botão "Novo cliente" para a direita | CSS: .espacador
clientes>main>div>label> Caixinha "Mostrar inativos" com o texto ao lado | CSS: .dica, style inline
clientes>main>div>label>input> Caixinha de marcar para incluir os clientes desativados | JS: tela.mostrarInativos
clientes>main>div>a> Botão "Novo cliente": abre o formulário de cadastro | CSS: .botao, .botao-principal
clientes>main>div> Lista dos clientes (preenchida pelo JS) | CSS: .lista | JS: tela.lista
clientes>script> Carrega js/api.js e js/clientes.js
==============================================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - TabFlower</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <div class="marca">Tab<span>Flower</span></div>
            <nav>
                <ul class="abas">
                    <li><a href="painel.html">Painel</a></li>
                    <li><a href="clientes.html" class="ativa">Clientes</a></li>
                    <li><a href="processos.html">Processos</a></li>
                    <li><a href="documentos.html">Documentos</a></li>
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="checklists.html">Checklists</a></li>
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina">

        <h1 class="titulo-pagina">Clientes</h1>
        <p class="subtitulo-pagina">
            Busque pelo nome ou pelo CPF/CNPJ. Cada cliente cadastrado ganha
            uma pasta padronizada no servidor.
        </p>

        <div id="aviso" class="escondido"></div>

        <div class="barra-acoes">
            <form class="busca" id="form-busca">
                <input type="text"
                       id="campo-busca"
                       placeholder="Nome ou CPF/CNPJ"
                       aria-label="Buscar cliente">
                <button type="submit" class="botao">Buscar</button>
            </form>

            <button type="button" class="botao" id="botao-limpar">Ver todos</button>

            <div class="espacador"></div>

            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="mostrar-inativos">
                Mostrar inativos
            </label>

            <a href="cliente-form.html" class="botao botao-principal">Novo cliente</a>
        </div>

        <div id="lista" class="lista"></div>

    </main>

    <script charset="UTF-8" src="js/api.js"></script>
    <script charset="UTF-8" src="js/clientes.js"></script>
</body>
</html>
