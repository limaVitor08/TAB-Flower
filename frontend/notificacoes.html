<!DOCTYPE html>
<!-- notificacoes>html> Raiz da página, com idioma português do Brasil -->
<html lang="pt-BR">
<!-- notificacoes>head> Parte invisível da página: configurações, título da aba e arquivos ligados -->
<head>
    <!-- notificacoes>head>meta> Usa a codificação UTF-8 para os acentos aparecerem certo -->
    <meta charset="UTF-8">
    <!-- notificacoes>head>meta> Ajusta a página à largura da tela (celular) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- notificacoes>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- notificacoes>head>link> Adianta a conexão com o servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- notificacoes>head>link> Carrega as fontes Archivo (títulos), Roboto Mono (números) e Source Sans 3 (texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Roboto+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <!-- notificacoes>head>link> Liga o arquivo de estilo do site (css/estilo.css) -->
    <!-- [CSS] css/estilo.css -->
    <link rel="stylesheet" href="css/estilo.css">
    <!-- notificacoes>head>title> Texto da aba do navegador: "Avisos - TabFlower" -->
    <title>Avisos - TabFlower</title>
</head>
<!-- notificacoes>body> Corpo da página: tudo que aparece na tela -->
<!-- [CSS] body -->
<body>
    <!-- notificacoes>header> Faixa do topo com o logo, o menu de abas e o usuário logado -->
    <!-- [CSS] .cabecalho -->
    <header class="cabecalho">
        <!-- notificacoes>header>div> Organiza o topo: logo, abas e usuário lado a lado -->
        <!-- [CSS] .cabecalho-conteudo | .cabecalho-conteudo @media (max-width: 700px) -->
        <!-- [JS] api.js: montarBarraUsuario() -->
        <div class="cabecalho-conteudo">
            <!-- notificacoes>header>div>div> Logo TabFlower -->
            <!-- [CSS] .marca -->
            <!-- notificacoes>header>div>div>span> Palavra "Flower" do logo -->
            <!-- [CSS] .marca span -->
            <div class="marca">Tab<span>Flower</span></div>
            <!-- notificacoes>header>div>nav> Menu de navegação entre as telas -->
            <nav>
                <!-- notificacoes>header>div>nav>ul> Lista das abas do menu -->
                <!-- [CSS] .abas | .abas @media (max-width: 700px) -->
                <ul class="abas">
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Painel" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Painel" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="painel.html">Painel</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Clientes" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Clientes" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="clientes.html">Clientes</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Processos" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Processos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="processos.html">Processos</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Documentos" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Documentos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="documentos.html">Documentos</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Avisos" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Avisos" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="notificacoes.html">Avisos</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Usuários" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Usuários" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="usuarios.html">Usuários</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Checklists" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Checklists" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="checklists.html">Checklists</a></li>
                    <!-- notificacoes>header>div>nav>ul>li> Item do menu: aba "Importação" -->
                    <!-- notificacoes>header>div>nav>ul>li>a> Link para a tela "Importação" -->
                    <!-- [CSS] .abas a | .abas a:hover -->
                    <li><a href="importacoes.html">Importação</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- notificacoes>main> Área principal dos avisos -->
    <!-- [CSS] .pagina -->
    <main class="pagina">
        <!-- notificacoes>main>h1> Título da página: "Avisos" -->
        <!-- [CSS] .titulo-pagina -->
        <h1 class="titulo-pagina">Avisos</h1>
        <!-- notificacoes>main>p> Texto explicativo abaixo do título -->
        <!-- [CSS] .subtitulo-pagina -->
        <p class="subtitulo-pagina">
            Gerados pelo sistema quando um documento é anexado a um processo.
            Vão direto para o advogado responsável, sem ninguém precisar avisar.
        </p>

        <!-- notificacoes>main>div> Caixa de mensagens de erro ou sucesso (começa escondida) -->
        <!-- [CSS] .escondido -->
        <!-- [JS] notificacoes.js: tela.aviso -->
        <div id="aviso" class="escondido"></div>

        <!-- notificacoes>main>div> Faixa com o filtro de não lidos e a fonte dos dados -->
        <!-- [CSS] .barra-filtros -->
        <div class="barra-filtros">
            <!-- notificacoes>main>div>label> Caixinha "Apenas não lidos" com o texto ao lado -->
            <!-- [CSS] .dica | .barra-filtros label | style inline -->
            <label class="dica" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <!-- notificacoes>main>div>label>input> Caixinha de marcar para mostrar só os avisos não lidos -->
                <!-- [JS] notificacoes.js: tela.apenasNaoLidas -->
                <input type="checkbox" id="apenas-nao-lidas">
                Apenas não lidos
            </label>

            <!-- notificacoes>main>div>span> Rótulo que indica a procedure que fornece os avisos -->
            <!-- [CSS] .dica | #rotulo-fonte | #rotulo-fonte @media (max-width: 700px) -->
            <span class="dica" id="rotulo-fonte">Fonte: sp_notificacoes_advogado</span>
        </div>

        <!-- notificacoes>main>div> Lista dos avisos de quem está logado (preenchida pelo JS) -->
        <!-- [CSS] .lista -->
        <!-- [JS] notificacoes.js: tela.lista -->
        <div id="lista" class="lista"></div>
    </main>

    <!-- notificacoes>script> Carrega o api.js: chamadas à API, sessão de login e funções de apoio -->
    <!-- [JS] js/api.js -->
    <script charset="UTF-8" src="js/api.js"></script>
    <!-- notificacoes>script> Carrega o notificacoes.js, que faz esta página funcionar -->
    <!-- [JS] js/notificacoes.js -->
    <script charset="UTF-8" src="js/notificacoes.js"></script>
</body>
</html>
